name: OnlineBookReader Frontend CI

on:
  push:
    branches:
      - main
      - master
      - develop
      - feature/FE-UC001-UC003

  pull_request:
    branches:
      - main
      - master
      - develop

  workflow_dispatch:

jobs:
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json 

      - name: Install dependencies
        run: npm ci

      - name: Run linter (nếu có)
        run: npm run lint --if-present

      - name: Run build test
        run: npm run build